name: Publish CTI Sentinel classroom image (cloud build)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'lite = 1B model (recommended for 8 GB); full = 3B model'
        required: true
        type: choice
        default: lite
        options:
          - lite
          - full

permissions:
  contents: read

concurrency:
  group: classroom-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout the current complete application source
        uses: actions/checkout@v4

      - name: Validate build inputs
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f Dockerfile.classroom
          test -f docker/classroom-start.sh
          test -f requirements.txt
          test -f frontend/vt_ui.js
          test -s data/public-threat-snapshot.json.gz
          bash -n docker/classroom-start.sh
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Set repository Actions secret DOCKERHUB_TOKEN using a Docker Hub access token.'
            exit 1
          fi
          echo 'The image does not contain cloud database credentials or API keys.'

      - name: Free unused SDK space on the temporary GitHub runner
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to my Docker Hub account
        uses: docker/login-action@v3
        with:
          username: ishanmahansaria
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the selected image and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.classroom
          platforms: linux/amd64
          push: true
          build-args: |
            CHAT_MODEL=${{ inputs.profile == 'lite' && 'llama3.2:1b' || 'llama3.2:3b' }}
          tags: |
            ishanmahansaria/cti-sentinel-classroom:${{ inputs.profile }}
            ishanmahansaria/cti-sentinel-classroom:${{ github.sha }}-${{ inputs.profile }}
          provenance: false

      - name: Display my published image
        shell: bash
        run: |
          echo 'Build and push action completed.'
          echo 'Docker Hub: https://hub.docker.com/r/ishanmahansaria/cti-sentinel-classroom/tags'
          echo 'Pull: docker pull ishanmahansaria/cti-sentinel-classroom:${{ inputs.profile }}'
          echo 'Test on another computer before submission; a completed build is not a runtime test.'
