name: Verify my CTI Sentinel application
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_USERNAME: ishan
      APP_PASSWORD: this-is-only-a-disposable-test-password
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: cti_sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install my test dependencies
        run: python -m pip install -r requirements-dev.txt pytest
      - name: Run static Python compilation
        run: python -m compileall -q backend tests app.py worker.py
      - name: Validate browser JavaScript syntax
        run: |
          node --check frontend/vt_ui.js
          node --check frontend/intel.js
      - name: Run my Python tests
        run: python -m pytest -q
      - name: Verify my Docker Hub mapping and no secrets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path("backend/coursework.py").read_text()
          assert "https://hub.docker.com/r/ishanmahansaria/" in text
          assert "https://hub.docker.com/r/solankyyy/" not in text
          assert Path("app.py").is_file()
          assert Path("vercel.json").is_file()
          assert Path("frontend/intel.html").is_file()
          for f in Path(".").rglob("*"):
              if f.is_file() and ".git" not in f.parts:
                  assert f.name not in {".env",".env.local",".env.production"}
          print("Source, Docker links and local secret exclusions verified.")
          PY
